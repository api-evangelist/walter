aid: walter
name: Walter
description: >-
  Walter is a San Francisco-based Y Combinator (Spring 2026) startup building an
  AI employee for the manufacturing back office. Founded in 2026 by Nikolas Keller
  (CEO) and Lukas Postulka (CTO), Walter logs into the enterprise systems a company
  already runs on — SAP, Oracle NetSuite, Microsoft Dynamics 365, Teams, Outlook and
  Gmail — the way a new hire would, and takes over manual paperwork: reading sales
  orders and purchase orders from emails and PDFs, capturing and validating the data,
  cross-checking it against the ERP, ordering from suppliers and catching pricing errors
  before they ship. It uses a purpose-built document-understanding model (rather than
  legacy template OCR) that supports 270+ languages and reaches 90%+ accuracy after
  minimal training, cutting an order that used to take 15 minutes down to about one.
  Walter requires no integration project and no rip-and-replace, operating the same
  screens the team already uses. It is an early-stage company with no public API,
  developer program, SDKs or documentation; this profile captures its public identity
  and security posture for the API Evangelist network.
